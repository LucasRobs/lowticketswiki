<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Radar Low Ticket</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/estilo.css">
  <script>
    try {
      var t = localStorage.getItem("lt-tema");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="#/" aria-label="Radar Low Ticket — visão geral">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".35"/>
          <circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/>
          <path d="M12 12 L19.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="2" fill="currentColor"/>
        </svg>
        <span>Radar Low Ticket</span>
      </a>
      <nav class="abas" aria-label="Seções">
        <a href="#/" data-rota="visao">Visão geral</a>
        <a href="#/ofertas" data-rota="ofertas">Ofertas</a>
        <a href="#/rodadas" data-rota="rodadas">Rodadas</a>
        <a href="#/qualidade" data-rota="qualidade">Qualidade</a>
      </nav>
      <div class="topo-dir">
        <span id="ao-vivo" class="ao-vivo" hidden></span>
        <button id="tema" class="botao-icone" type="button" aria-label="Alternar tema claro/escuro" title="Tema">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="conteudo" tabindex="-1">
    <p class="carregando">Carregando o radar…</p>
  </main>
  <footer class="rodape" id="rodape"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <noscript><p class="carregando">Este painel precisa de JavaScript.</p></noscript>
</body>
</html>
